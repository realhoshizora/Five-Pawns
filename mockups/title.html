<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Five Pawns — Title</title>
<link rel="stylesheet" href="style.css">
<style>
	.screen { --ca: 1; }
	.fan { position: absolute; left: 960px; top: 96px; width: 0; height: 0; z-index: 3; }
	.fan .card { --w: 150px; --h: 513px; position: absolute; left: -75px; top: 0; transform-origin: 50% 160%; }
	.fan .card:nth-child(1) { transform: rotate(-32deg); }
	.fan .card:nth-child(2) { transform: rotate(-16deg) translateY(-8px); }
	.fan .card:nth-child(3) { transform: rotate(0deg) translateY(-14px); }
	.fan .card:nth-child(4) { transform: rotate(16deg) translateY(-8px); }
	.fan .card:nth-child(5) { transform: rotate(32deg); }
	/* phần chữ lộn ngược ở đáy lá nằm sau chữ FIVE PAWNS; che hẳn để không lộ mảnh chữ qua khe giữa các ký tự */
	.fan .card img { -webkit-mask-image: linear-gradient(to bottom, #000 70%, transparent 78%); mask-image: linear-gradient(to bottom, #000 70%, transparent 78%); }
	.fan .blood { left: 330px; top: 86px; z-index: 6; transform: rotate(32deg); }

	.title { position: absolute; left: 0; right: 0; top: 452px; z-index: 10; text-align: center; }
	.title h1 { font-size: 178px; line-height: 1; color: var(--diep); letter-spacing: .01em; filter: url(#woodcut); text-shadow: calc(-2px * var(--ca)) 0 rgba(255, 30, 50, .55), calc(2px * var(--ca)) 0 rgba(30, 200, 255, .45), 0 14px 30px rgba(0, 0, 0, .8); }
	.title .sub { margin-top: 18px; font-size: 60px; color: #d0372a; display: flex; gap: 22px; align-items: baseline; justify-content: center; }
	.title .sub .han-font { font-size: 84px; letter-spacing: .3em; margin-right: -.3em; }
	.tagline { position: absolute; right: 54px; bottom: 112px; z-index: 10; font-size: 34px; color: #cdbb98; }

	.menu { position: absolute; left: 118px; top: 716px; z-index: 10; display: flex; flex-direction: column; gap: 4px; list-style: none; }
	.menu a { display: inline-flex; align-items: center; gap: 18px; font-family: "Bevan", serif; text-transform: uppercase; font-size: 30px; letter-spacing: .03em; color: var(--do); text-decoration: none; padding: 5px 0; }
	.menu a:hover { color: var(--do-sang); }
	.menu a:focus-visible { outline: 3px solid var(--do-sang); outline-offset: 6px; }
	.menu a[aria-current] { color: var(--do-sang); background: var(--paper-tex), var(--son); padding: 12px 26px 14px; border-radius: 5px; transform: rotate(-1.2deg); box-shadow: inset 0 0 0 3px var(--do-sang), inset 0 0 0 6px var(--son), inset 0 0 0 7.5px var(--do-sang), 0 10px 24px rgba(0,0,0,.6); margin-bottom: 8px; }

	.meta { position: absolute; right: 54px; bottom: 70px; z-index: 40; font-size: 26px; color: #a8987e; text-align: right; }
</style>
</head>
<body>
<main class="screen">
	<canvas class="swirl" data-mode="calm"></canvas>

	<div class="fan" aria-label="Five Red Pawns">
		<div data-card="r0"></div><div data-card="r0"></div><div data-card="r0"></div><div data-card="r0"></div><div data-card="r0"></div>
		<canvas class="blood" data-seed="11" data-scale="7" width="14" height="12"></canvas>
	</div>

	<header class="title">
		<h1 class="carved">Five Pawns</h1>
		<p class="sub ca"><span class="han-font">五子</span></p>
	</header>
	<p class="tagline ca">Lose the hand. Cut a rope.</p>

	<nav>
		<ul class="menu">
			<li><a href="table.html" aria-current="page">Play offline</a></li>
			<li><a href="#">Co-op online</a></li>
			<li><a href="#">How to play</a></li>
			<li><a href="#">Settings</a></li>
			<li><a href="#">Quit</a></li>
		</ul>
	</nav>

	<p class="meta ca">v0.1 · mockup</p>
	<div class="crt"></div>
</main>
<script src="fx.js"></script>
</body>
</html>
